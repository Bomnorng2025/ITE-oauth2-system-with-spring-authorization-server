server:
  port: 9000

spring:
  application:
    name: spring-authorization-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oauth2_authorization_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:fdsa}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/oauth2-authorization-schema.sql
        - classpath:db/oauth2-authorization-consent-schema.sql
#        - classpath:org/springframework/security/oauth2/server/authorization/client/oauth2-registered-client-schema.sql
#        - classpath:org/springframework/security/oauth2/server/authorization/oauth2-authorization-schema.sql
#        - classpath:org/springframework/security/oauth2/server/authorization/oauth2-authorization-consent-schema.sql

logging:
  level:
    org.springframework.security: INFO
    org.springframework.jdbc.datasource.init: DEBUG